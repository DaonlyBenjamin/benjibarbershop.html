<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Barbershop Store</title>
</head>
   <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="style.css">




<section id="store" class="store-section">

    <h2 class="merch-heading">Shop Our New Merch</h2>

    <div class="merch-container">

        <!-- T-Shirt 1 -->
        <div class="merch-item">

            <img 
                src="./benji-tshirt.PNG" 
                alt="Benji Kutz T-Shirt"
                class="merch-image"
            >

            <h3>Benji Kutz T-Shirt</h3>

            <p class="price">R300</p>

            <label for="size1">Size:</label>

            <select id="size1" class="size-select">
                <option value="Small">Small</option>
                <option value="Medium">Medium</option>
                <option value="Large">Large</option>
                <option value="XL">XL</option>
                <option value="XXL">XXL</option>
            </select>

            <a 
                href="https://wa.me/27661642330"
                class="buy-button"
                target="_blank"
                onclick="buyShirt(event, 'Benji Kutz T-Shirt', '250', 'size1')"
            >
                Buy Now
            </a>

        </div>


       
      

</section>
